plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.4'
}

group = 'com.mairor'
version = '0.0.1-SNAPSHOT'
description = 'MAIROR 백엔드 서버'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 웹·보안
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // API 문서 (Swagger UI). dev 에서만 열고 prod 는 application-prod.yml 에서 끈다
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

    // 데이터·세션·캐시
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    // 분석 상태 SSE 가 변경 알림을 LISTEN 으로 받는다(PGConnection.getNotifications)
    implementation 'org.postgresql:postgresql'

    // 메일 발송 (가입 이메일 인증번호). SMTP 는 Gmail
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // 외부 HTTP 호출 (YouTube·LLM·AI 서버)
    implementation 'org.springframework.boot:spring-boot-starter-restclient'

    // 객체 저장소 (S3: 분석 영상·프레임). 동기 클라이언트만 쓰므로 Netty 비동기 클라이언트는 뺀다
    implementation platform('software.amazon.awssdk:bom:2.39.6')
    implementation('software.amazon.awssdk:s3') {
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-session-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    // AI 서버로 보낼 가이드 입력을 공유 스키마(shared/guide-input)로 검사한다. 실행 코드는 쓰지 않는다
    testImplementation 'com.networknt:json-schema-validator:1.5.6'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('check') {
    dependsOn 'spotlessCheck'
}

tasks.named('test') {
    useJUnitPlatform()
    // 개발자 .env 의 값(메일 발송·가입 이메일 인증 요구)이 테스트 결과를 바꾸지 않도록 고정한다. 필요한 테스트는 properties 로 직접 켠다
    environment 'MAIL_ENABLED', 'false'
    environment 'SIGNUP_REQUIRE_EMAIL_VERIFICATION', 'false'
    // 만료 세션 정리 작업이 테스트 중에 끼어들지 않게 끈다. 정리 작업을 검증하는 테스트는 properties 로 직접 켜거나 직접 실행한다
    environment 'SESSION_SWEEP_ENABLED', 'false'
}
