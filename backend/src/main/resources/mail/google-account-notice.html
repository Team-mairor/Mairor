<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>[Mairor] 비밀번호 재설정 안내</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Instrument+Sans:wght@500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  @media only screen and (max-width: 480px) {
    .px { padding-left: 24px !important; padding-right: 24px !important; }
    .logo { font-size: 44px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#F6F1F4;">

<!-- 받은편지함 미리보기 문구 -->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#F6F1F4;font-size:1px;line-height:1px;">
  이 이메일은 Google 로그인으로 가입돼 있어요. Google로 로그인해 주세요.
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F6F1F4;">
  <tr>
    <td align="center" style="padding:40px 16px;">

      <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;background:#FFFFFF;border:1px solid #EFE4EA;border-radius:28px;">

        <!-- 로고 -->
        <tr>
          <td align="center" class="px" style="padding:48px 40px 0 40px;">
            <div class="logo" style="font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-style:italic;font-size:52px;line-height:1;letter-spacing:-0.02em;color:#991E5A;">mairor</div>
          </td>
        </tr>
        <tr>
          <td align="center" class="px" style="padding:14px 40px 0 40px;">
            <span style="display:inline-block;padding:7px 14px;border-radius:999px;background:#F6F1F4;font-family:'Instrument Sans','Helvetica Neue',Arial,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.16em;color:#3A0E25;">AI MAKEUP MIRROR</span>
          </td>
        </tr>

        <!-- 제목 -->
        <tr>
          <td align="center" class="px" style="padding:36px 40px 0 40px;">
            <div style="font-family:'Gowun Dodum','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:28px;line-height:1.3;color:#3A0E25;word-break:keep-all;">Google로 로그인해 주세요</div>
          </td>
        </tr>
        <tr>
          <td align="center" class="px" style="padding:12px 40px 0 40px;">
            <div style="font-family:'Gowun Dodum','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:16px;line-height:1.6;color:#6E5A64;word-break:keep-all;">비밀번호 재설정을 요청하셨지만,<br>이 이메일은 Google 로그인으로 가입돼 있어 비밀번호가 없어요.</div>
          </td>
        </tr>

        <!-- 안내 상자 -->
        <tr>
          <td align="center" class="px" style="padding:32px 40px 0 40px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FCE8F1;border-radius:22px;">
              <tr>
                <td align="center" style="padding:26px 20px 28px 20px;">
                  <div style="font-family:'Gowun Dodum','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:17px;line-height:1.6;color:#3A0E25;word-break:keep-all;">mairor 로그인 화면에서<br><strong style="color:#991E5A;">Google로 로그인</strong>을 눌러 주세요.</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- 안내 -->
        <tr>
          <td align="center" class="px" style="padding:36px 40px 0 40px;">
            <div style="height:1px;line-height:1px;font-size:1px;background:#EFE4EA;">&nbsp;</div>
          </td>
        </tr>
        <tr>
          <td align="center" class="px" style="padding:24px 40px 0 40px;">
            <div style="font-family:'Gowun Dodum','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:14px;line-height:1.7;color:#6E5A64;word-break:keep-all;">본인이 요청하지 않았다면 이 메일을 무시해 주세요.<br>계정에는 아무 변화가 없어요.</div>
          </td>
        </tr>

        <!-- 푸터 -->
        <tr>
          <td align="center" class="px" style="padding:28px 40px 44px 40px;">
            <div style="font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-style:italic;font-size:18px;line-height:1.3;color:#6E5A64;word-break:keep-all;">Your mirror, your makeup artist.</div>
          </td>
        </tr>

      </table>

      <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;">
        <tr>
          <td align="center" style="padding:20px 16px 0 16px;font-family:'Gowun Dodum','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:12px;line-height:1.6;color:#A8949E;">이 메일은 발신 전용입니다.</td>
        </tr>
      </table>

    </td>
  </tr>
</table>

</body>
</html>
