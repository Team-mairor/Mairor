spring:
  data:
    redis:
      host: ${REDIS_HOST:redis}
  session:
    data:
      redis:
        namespace: mairor:session
        repository-type: indexed
        flush-mode: immediate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# 운영은 ALB → nginx → api 를 거친다. X-Forwarded-For·Proto 에서 사용자 IP 와 https 를 꺼내 쓴다.
# 내부 대역(ALB 10.x, nginx 컨테이너 172.x)만 건너뛰므로, 끄면 요청 제한이 모든 사용자를 nginx IP 하나로 센다
server:
  forward-headers-strategy: native

# 운영 로그는 JSON(logstash 형식) 한 줄씩. 앱 서버 alloy 가 level 과 작업 칸(analysis_job_id · job_id · video_id 등)을 꺼내
# Grafana(Loki)에서 작업 하나의 BE · AI 로그를 찾는다(S15P31A306-401, infra/alloy/config.alloy). 로컬 · 테스트는 글 로그 그대로
logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    com.mairor.backend: INFO

# API 문서(Swagger)는 운영에 노출하지 않는다. 꺼지면 /v3/api-docs·/swagger-ui/** 는 404
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 수집기는 BE 와 다른 서버에서 돌아 결과 파일을 S3 catalog-runs/ 에 올린다. BE 는 거기서 받아 캐시 폴더에 두고 읽는다
catalog:
  import:
    source: storage
    result-dir: ${CATALOG_IMPORT_RESULT_DIR:/tmp/mairor-catalog-runs}
  # 색 품질 기준값(S15P31A306-515 눈 확인 표로 정함, 시연·운영 공통). 통과 55칸 중 54칸 맞음.
  # 출처 이름이 키라 환경변수 이름으로는 못 덮으므로 값마다 따로 둔 환경변수로만 바꾼다
  color:
    min-quality:
      PRODUCT_PHOTO: ${CATALOG_COLOR_MIN_QUALITY_PRODUCT_PHOTO:0.75}
      SWATCH_CHIP: ${CATALOG_COLOR_MIN_QUALITY_SWATCH_CHIP:0.55}
    label-in-image-enabled: ${CATALOG_COLOR_LABEL_IN_IMAGE_ENABLED:true}
  # DB 에 없는 화장품 수집 요청을 보낼 SQS 큐(S15P31A306-517·514). 비우면 보내지 않고 요청은 QUEUED 로 남는다.
  # 값은 Parameter Store /mairor/prod/CATALOG_COLLECT_QUEUE_URL. BE 서버 역할에 이 큐의 sqs:SendMessage 가 있어야 한다
  collect:
    queue-url: ${CATALOG_COLLECT_QUEUE_URL:}

# 운영 저장소는 S3 비공개 버킷(-203). 자격 증명은 EC2 역할이라 키를 두지 않는다
app:
  login:
    attempt-store: ${LOGIN_ATTEMPT_STORE:redis}
  verification-store:
    type: ${VERIFICATION_STORE:redis}
  password-reset:
    lock-store: ${PASSWORD_RESET_LOCK_STORE:redis}
  rate-limit:
    store-type: ${RATE_LIMIT_STORE:redis}
  oauth:
    google:
      state-store: ${GOOGLE_STATE_STORE:redis}
  storage:
    type: s3
    s3:
      bucket: ${APP_STORAGE_S3_BUCKET:mairor-prod-media}
  analysis:
    worker:
      work-dir: ${ANALYSIS_WORK_DIR:/tmp/mairor-analysis}
  ai:
    # 운영 compose: ai·api·worker 가 core 네트워크. api 는 api-a·api-b 둘 다 별칭 api
    base-url: ${AI_BASE_URL:http://ai:8000}
    callback-base-url: ${AI_CALLBACK_BASE_URL:http://api:8080/api}
