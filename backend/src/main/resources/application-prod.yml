spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# 운영은 ALB → nginx → api 를 거친다. X-Forwarded-For·Proto 에서 사용자 IP 와 https 를 꺼내 쓴다.
# 내부 대역(ALB 10.x, nginx 컨테이너 172.x)만 건너뛰므로, 끄면 요청 제한이 모든 사용자를 nginx IP 하나로 센다
server:
  forward-headers-strategy: native

logging:
  level:
    root: INFO
    com.mairor.backend: INFO

# API 문서(Swagger)는 운영에 노출하지 않는다. 꺼지면 /v3/api-docs·/swagger-ui/** 는 404
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 수집기는 BE 와 다른 서버에서 돌아 결과 파일을 S3 catalog-runs/ 에 올린다. BE 는 거기서 받아 캐시 폴더에 두고 읽는다
catalog:
  import:
    source: storage
    result-dir: ${CATALOG_IMPORT_RESULT_DIR:/tmp/mairor-catalog-runs}

# 운영 저장소는 S3 비공개 버킷(-203). 자격 증명은 EC2 역할이라 키를 두지 않는다
app:
  storage:
    type: s3
    s3:
      bucket: ${APP_STORAGE_S3_BUCKET:mairor-prod-media}
  analysis:
    worker:
      work-dir: ${ANALYSIS_WORK_DIR:/tmp/mairor-analysis}
  ai:
    # 운영 compose: ai·api·worker 가 core 네트워크. api 는 api-a·api-b 둘 다 별칭 api
    base-url: ${AI_BASE_URL:http://ai:8000}
    callback-base-url: ${AI_CALLBACK_BASE_URL:http://api:8080/api}
