spring:
  application:
    name: mairor-backend
  config:
    # 로컬 전용 값은 backend/.env 에 둔다 (git 제외). 없으면 무시한다.
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mairor}
    username: ${DB_USERNAME:mairor}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      # Flyway 도입(3단계) 전까지 Spring Session 이 세션 테이블을 직접 만든다. 도입 후 never 로 바꾼다.
      initialize-schema: always
  jackson:
    # Jackson 3: 날짜는 기본으로 ISO-8601 문자열로 직렬화된다 (write-dates-as-timestamps 설정 불필요)
    time-zone: UTC
    # null 필드는 생략하지 않고 "필드": null 로 내보낸다 (노션 API 명세 "생략·null·빈 값").
    # 오류 응답의 details 만 ErrorResponse 의 @JsonInclude 로 생략한다.
  cache:
    type: caffeine

server:
  error:
    # 오류는 항상 common.error.ErrorResponse 형식으로만 응답한다
    whitelabel:
      enabled: false
  servlet:
    context-path: /api
    session:
      cookie:
        name: __Host-sessionId
        secure: true
        http-only: true
        # 서비스 세션은 Strict. Google 인증 복귀용 임시 쿠키만 Lax 로 따로 둔다 (노션 API 명세 인증·배포 상세)
        same-site: strict
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  security:
    # 회원가입·로그인처럼 세션이 없는 요청을 보낼 수 있는 프론트 Origin (쉼표 구분).
    # 기본값이 없어서 운영에서 ALLOWED_ORIGINS 를 빠뜨리면 앱이 기동하지 않는다. dev 기본값은 application-dev.yml.
    allowed-origins: ${ALLOWED_ORIGINS:}
