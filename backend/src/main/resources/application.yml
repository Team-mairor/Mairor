spring:
  application:
    name: mairor-backend
  config:
    # 로컬 전용 값은 backend/.env 에 둔다 (git 제외). 없으면 무시한다.
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mairor}
    username: ${DB_USERNAME:mairor}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      # Flyway 도입(3단계) 전까지 Spring Session 이 세션 테이블을 직접 만든다. 도입 후 never 로 바꾼다.
      initialize-schema: always
  jackson:
    # Jackson 3: 날짜는 기본으로 ISO-8601 문자열로 직렬화된다 (write-dates-as-timestamps 설정 불필요)
    time-zone: UTC
    # null 필드는 생략한다 (AI 서버의 exclude_none 과 동일)
    default-property-inclusion: non_null
  cache:
    type: caffeine

server:
  error:
    # 오류는 항상 common.error.ErrorResponse 형식으로만 응답한다
    whitelabel:
      enabled: false
  servlet:
    context-path: /api
    session:
      cookie:
        name: __Host-sessionId
        secure: true
        http-only: true
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
