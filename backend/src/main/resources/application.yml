spring:
  application:
    name: mairor-backend
  config:
    # 로컬 전용 값은 backend/.env 에 둔다 (git 제외). 없으면 무시한다.
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mairor}
    username: ${DB_USERNAME:mairor}
    password: ${DB_PASSWORD:}
    hikari:
      # 연결을 얻기까지 기다리는 최대 시간(ms). 기본 30초는 DB 가 막혔을 때 요청이 그만큼 쌓인다. 넘으면 503
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    # 서버 세션 유휴 만료. 인증 요청이 올 때마다 연장된다
    timeout: ${SESSION_TIMEOUT:3d}
    jdbc:
      # 세션을 만들고 속성을 바꾸는 즉시 저장한다(기본값 on_save 는 응답을 커밋할 때 저장). 로그인이 세션을 발급한 직후 비밀번호 버전을
      # 다시 확인하는 방어(UserLoginService)가 의미를 가지려면, 비밀번호 재설정이 세션 목록을 읽을 때 그 세션이 이미 저장돼 있어야 한다
      flush-mode: immediate
      # Flyway 도입 전까지 세션 테이블을 직접 만든다
      initialize-schema: always
      # Spring 의 만료 세션 정리 작업을 끈다("-"). 종료 훅을 호출한 뒤 지우는 ExpiredSessionSweeper 가 대신한다 (app.session.sweep)
      cleanup-cron: "-"
  jackson:
    time-zone: UTC
    # null 필드도 "필드": null 로 내보낸다 (오류 응답의 details 만 ErrorResponse 에서 생략)
  cache:
    type: caffeine
  mail:
    # 인증번호 발송용 SMTP (Gmail). 계정·앱 비밀번호는 환경변수로만 넣고, 실제 발송은 app.mail.enabled=true 일 때만 쓴다
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # 메일 서버가 느려도 요청이 오래 멈추지 않게 5초로 끊는다
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  error:
    # 오류는 항상 common.error.ErrorResponse 형식으로만 응답한다
    whitelabel:
      enabled: false
  servlet:
    context-path: /api
    session:
      cookie:
        name: __Host-sessionId
        secure: true
        http-only: true
        # 서비스 세션은 Strict. Google 인증 복귀용 임시 쿠키만 Lax 로 따로 둔다
        same-site: strict
        path: /
        # 쿠키 최대 수명의 상한. 인증 요청이 성공하면 이 값(또는 절대 만료까지 남은 시간 중 짧은 쪽)으로 갱신된다
        max-age: ${SESSION_COOKIE_MAX_AGE:3d}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # SMTP 장애가 서비스 전체 DOWN 으로 보이지 않게 메일은 헬스체크에서 뺀다
    mail:
      enabled: false

app:
  security:
    # 세션 없는 요청(회원가입 등)을 보낼 수 있는 프론트 Origin (쉼표 구분). 운영에서 비어 있으면 기동하지 않는다
    allowed-origins: ${ALLOWED_ORIGINS:}
  signup:
    # true 면 가입에 이메일 인증 토큰이 필요하다. prod 에서 켜면 메일 발송·비밀키 설정이 필수다
    require-email-verification: ${SIGNUP_REQUIRE_EMAIL_VERIFICATION:false}
  mail:
    # false 면 메일을 보내지 않는다 (dev 는 인증번호를 로그로만 남기고, prod 는 발송이 항상 실패한다)
    enabled: ${MAIL_ENABLED:false}
    # 비우면 MAIL_USERNAME 을 쓴다
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:Mairor}
  verification-store:
    # 인증 임시 상태 저장소. memory 만 있다 (서버 1대 전제)
    type: ${VERIFICATION_STORE:memory}
  email-verification:
    # 인증번호 해시용 비밀키. 비우면 기동할 때마다 임의로 만든다
    secret: ${EMAIL_VERIFICATION_SECRET:}
    code-ttl: 10m
    resend-cooldown: 60s
    hourly-limit: 5
    max-attempts: 5
    token-ttl: 30m
  password-reset:
    # 비밀번호 재설정. 가입 이메일 인증(app.email-verification)과 저장소·인증번호가 섞이지 않고, 인증번호 해시 비밀키는 같은 것을 쓴다
    code-ttl: 10m
    resend-cooldown: 60s
    hourly-limit: 5
    max-attempts: 5
    # 인증번호를 확인한 뒤 새 비밀번호를 저장하기까지의 시간
    token-ttl: 10m
  rate-limit:
    # 키는 클라이언트 IP, 초과하면 429 + Retry-After
    email-availability:
      limit: ${RATE_LIMIT_EMAIL_AVAILABILITY_LIMIT:30}
      window: ${RATE_LIMIT_EMAIL_AVAILABILITY_WINDOW:1m}
    # 인증번호 발송 (이메일별 쿨다운·시간당 횟수는 app.email-verification)
    email-verification:
      limit: ${RATE_LIMIT_EMAIL_VERIFICATION_LIMIT:10}
      window: ${RATE_LIMIT_EMAIL_VERIFICATION_WINDOW:10m}
    # 비밀번호 재설정 인증번호 발송 (이메일별 쿨다운·시간당 횟수는 app.password-reset)
    password-reset:
      limit: ${RATE_LIMIT_PASSWORD_RESET_LIMIT:10}
      window: ${RATE_LIMIT_PASSWORD_RESET_WINDOW:10m}
    # Google 로그인 시작
    google-login:
      limit: ${RATE_LIMIT_GOOGLE_LOGIN_LIMIT:20}
      window: ${RATE_LIMIT_GOOGLE_LOGIN_WINDOW:10m}
  session:
    # 절대 만료. 로그인 성공 시점부터 이 시간이 지나면 활동 중이어도 다시 로그인해야 한다. 일반 요청으로 연장하지 않는다.
    # 쿠키 최대 수명 <= 서버 유휴 만료 <= 절대 만료 여야 하며 어긋나면 앱이 기동하지 않는다
    absolute-timeout: ${SESSION_ABSOLUTE_TIMEOUT:30d}
    # 만료된 세션을 지우는 정리 작업. 지우기 전에 종료 훅을 호출한다. enabled=false 면 만료된 행을 아무도 지우지 않는다(테스트·점검용)
    sweep:
      enabled: ${SESSION_SWEEP_ENABLED:true}
      interval: ${SESSION_SWEEP_INTERVAL:1m}
      batch-size: ${SESSION_SWEEP_BATCH_SIZE:100}
      # 정리에 실패한(훅 또는 삭제 실패) 세션을 다시 시도하기까지 기다리는 시간
      retry-delay: ${SESSION_SWEEP_RETRY_DELAY:5m}
  login:
    # 이메일 하나에서 확정 실패가 이 횟수에 닿으면 lock-duration 동안 잠근다. 진행 중인 시도도 이 수에 포함된다 (5회로 올릴 예정)
    max-failures: ${LOGIN_MAX_FAILURES:3}
    lock-duration: ${LOGIN_LOCK_DURATION:30s}
    # 마지막 시도 후 실패 횟수를 기억하는 시간, 기억하는 이메일 상태의 최대 개수 (인메모리라 상한을 둔다)
    attempt-ttl: ${LOGIN_ATTEMPT_TTL:15m}
    max-entries: ${LOGIN_MAX_ENTRIES:10000}
    # 서버 전체에서 동시에 계산하는 로그인 BCrypt 수. 넘으면 기다리지 않고 429 로 거절한다 (서버 코어 수에 맞춰 조정)
    max-concurrent-hashes: ${LOGIN_MAX_CONCURRENT_HASHES:4}
  oauth:
    google:
      # GCP OAuth 클라이언트. 세 값을 모두 넣거나 모두 비운다. 비우면 Google 로그인만 503 이고, prod 에서 비어 있으면 기동하지 않는다
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      # Google 에 등록한 callback 주소. FE 주소의 /api 경로를 쓴다 (예: http://localhost:3000/api/v1/users/oauth/google/callback)
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
      # 로그인 시작부터 callback 까지, callback 뒤 처음 온 사용자가 가입을 마치기까지 허용하는 시간
      authorization-ttl: 10m
      signup-ttl: 10m
  agreements:
    # 현재 약관 버전. 필수 약관은 요청의 agreements[].version 이 이 값과 같아야 인정한다 (마케팅은 제외)
    versions:
      terms: ${AGREEMENT_TERMS_VERSION:2026-10-26}
      privacy: ${AGREEMENT_PRIVACY_VERSION:2026-10-26}
      age-over-14: ${AGREEMENT_AGE_OVER_14_VERSION:2026-10-26}
  internal:
    # 내부 API(/api/v1/internal/**: 운영자 명령·AI 콜백)의 공유 토큰. X-Internal-Token 헤더와 비교한다. 비우면 내부 API 는 모두 401
    token: ${INTERNAL_API_TOKEN:}
  storage:
    # local(개발·테스트, 아래 폴더) | s3(운영)
    type: ${APP_STORAGE_TYPE:local}
    local:
      root: ${APP_STORAGE_LOCAL_ROOT:${java.io.tmpdir}/mairor-storage}
    s3:
      bucket: ${APP_STORAGE_S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
  analysis:
    worker:
      # worker 프로파일에서만 쓴다. 대기 작업 확인 간격, 작업 임시 폴더, ffprobe 위치·시간 제한
      poll-interval: ${ANALYSIS_POLL_INTERVAL:5s}
      work-dir: ${ANALYSIS_WORK_DIR:${java.io.tmpdir}/mairor-analysis}
      ffprobe-path: ${FFPROBE_PATH:ffprobe}
      ffprobe-timeout: 60s
      # 프레임 추출(SEGMENTING). 운영 이미지에는 ffmpeg 가 들어 있다
      ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
      ffmpeg-timeout: 30m
      upload-concurrency: 8
    request:
      # 회원 분석 요청(API-VIDEO-002). 회원 한 명이 하루(Asia/Seoul 0시 초기화)에 만들 수 있는 새 분석 작업 수.
      # 재사용 · 합류는 세지 않는다. 시연 중 걸리지 않게 넉넉히 둔다(S15P31A306-362)
      daily-limit-per-user: ${ANALYSIS_DAILY_LIMIT_PER_USER:20}
    status:
      # 회원 상태 조회(API-VIDEO-003)의 pollAfterSeconds. 진행 화면은 SSE 로 받고, 폴링은 SSE 를 못 쓸 때만 쓴다
      poll-after: 3s
    sse:
      # 분석 상태 SSE(api 프로세스). 연결 최대 시간(지나면 EventSource 가 다시 붙음), 빈 신호 간격(ALB·nginx 60초 유휴 끊김보다 짧게),
      # 알림을 놓쳤을 때 DB 로 다시 맞추는 간격, LISTEN 연결 대기·재연결 최대 대기
      timeout: 30m
      ping-interval: 20s
      reconcile-interval: 30s
      listen-poll-timeout: 10s
      listen-retry-max: 30s
  youtube:
    # 영상 검색 · 선택(API-VIDEO-004 · 001). 비우면 검색 503 · 선택 502 로 실패한다(앱은 뜬다). 운영은 Parameter Store YOUTUBE_API_KEY
    api-key: ${YOUTUBE_API_KEY:}
    base-url: ${YOUTUBE_BASE_URL:https://www.googleapis.com/youtube/v3}
    connect-timeout: 3s
    read-timeout: 5s
    # 같은 검색어 · 페이지는 이 시간 동안 다시 쓴다(검색 1번 = 하루 할당량 10,000 중 101)
    search-cache-ttl: 10m
  ai:
    # AI 서버 가이드 생성(BUILDING_GUIDE · 콜백). 운영은 core 네트워크의 ai:8000, 콜백은 nginx 를 거치지 않는 api:8080
    base-url: ${AI_BASE_URL:http://localhost:8000}
    callback-base-url: ${AI_CALLBACK_BASE_URL:http://localhost:8080/api}
    # 프레임 사전 서명 URL 만료, 콜백을 기다리는 시간(지나면 AI 에 묻는다), 확인 간격(worker)
    frame-url-ttl: 24h
    callback-timeout: ${AI_CALLBACK_TIMEOUT:60m}
    watch-interval: 60s
  llm:
    gemini:
      # 단계 추출(worker). GMS 와 Google 직접은 요청 형식이 같아 주소·키만 바꾼다
      # GMS: https://gms.ssafy.io/gmsapi/generativelanguage.googleapis.com / Google 직접: 기본값
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      # 비우면 단계 추출이 LLM_UNAVAILABLE 로 실패한다(앱은 뜬다)
      api-key: ${GEMINI_API_KEY:}
      api-key-header: ${GEMINI_API_KEY_HEADER:x-goog-api-key}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
