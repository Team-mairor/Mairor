# 알림 규칙(S15P31A306-406). 규칙 · 임계치 표와 보는 법은 infra/README.md "알림".
# 메신저로 보내지 않는다(받는 곳 없음, 11.12 결정). 걸리면 Grafana → Alerting → Alert rules 에서 Firing 으로 보인다.
# 모양: A(쿼리) → B(마지막 값) → C(임계치). 로그 규칙은 맞는 줄이 없으면 결과가 비어 NoData → 정상으로 둔다.
apiVersion: 1

groups:
  # ---------- 분석: 앱 서버 로그(Loki, BE 는 JSON · S15P31A306-401) ----------
  - orgId: 1
    name: 분석
    folder: MAIROR 알림
    interval: 1m
    rules:
      - uid: mairor-processor-stall
        title: 노트북 응답 없음
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              # worker 가 10분에 한 번 남기는 경고. 15분 창이라 경고 사이에 풀리지 않는다
              expr: sum(count_over_time({service_name="worker"} |= "노트북이 작업을 가져가지 않음" [15m]))
          - &last
            refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{evaluator: {type: gt, params: [0]}}]
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: {severity: critical}
        annotations:
          summary: 노트북이 5분 넘게 작업을 가져가지 않아요
          description: >-
            분석 요청이 대기에 머물러 있어요. 노트북(--serve)이 켜져 있는지 확인하세요. 30분이 지나면 PROCESSOR_TIMEOUT 으로 실패해요.
            로그: {service_name="worker"} |= "노트북이 작업을 가져가지 않음"

      - uid: mairor-analysis-failures
        title: 분석 실패 잦음
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: sum(count_over_time({service_name=~"api|worker"} |= "분석 작업 끝" | json | analysis_status="FAILED" [30m]))
          - *last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{evaluator: {type: gt, params: [1]}}]
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: {severity: warning}
        annotations:
          summary: 30분 동안 분석이 2건 이상 실패했어요
          description: >-
            실패 코드는 로그에서 보세요: {service_name=~"api|worker"} |= "분석 작업 끝" | json | analysis_status="FAILED".
            NO_VALID_STEPS 는 메이크업이 아닌 영상일 수 있어요.

      - uid: mairor-analysis-timeouts
        title: 노트북 · AI 시간 초과
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: sum(count_over_time({service_name=~"api|worker"} |= "분석 작업 끝" | json | failure_code=~"PROCESSOR_TIMEOUT|ANALYSIS_TIMEOUT" [10m]))
          - *last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{evaluator: {type: gt, params: [0]}}]
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: {severity: critical}
        annotations:
          summary: 분석이 시간 초과로 실패했어요
          description: >-
            PROCESSOR_TIMEOUT 은 노트북이 30분 동안 작업을 안 가져감, ANALYSIS_TIMEOUT 은 AI 콜백이 오지 않음이에요.
            노트북 · AI 서버(mairor-ai) 상태를 확인하세요.

  # ---------- 서버 자원: 앱 · AI 서버 alloy 가 보내는 node 지표(Prometheus, server 라벨 app · ai) ----------
  - orgId: 1
    name: 서버
    folder: MAIROR 알림
    interval: 1m
    rules:
      - uid: mairor-cpu-high
        title: CPU 높음
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 100 * (1 - avg by (server) (rate(node_cpu_seconds_total{job="integrations/unix", mode="idle"}[5m])))
          - *last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{evaluator: {type: gt, params: [85]}}]
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.server }} 서버 CPU 가 10분 넘게 85% 위예요'
          description: 지금 {{ printf "%.0f" $values.B.Value }}%. 대시보드 "서버 · 컨테이너"에서 어느 컨테이너인지 보세요.

      - uid: mairor-memory-high
        title: 메모리 높음
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: max by (server) (100 * (1 - node_memory_MemAvailable_bytes{job="integrations/unix"} / node_memory_MemTotal_bytes{job="integrations/unix"}))
          - *last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{evaluator: {type: gt, params: [90]}}]
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.server }} 서버 메모리가 5분 넘게 90% 위예요'
          description: 지금 {{ printf "%.0f" $values.B.Value }}%. 계속되면 컨테이너가 OOM 으로 다시 뜰 수 있어요.

      - uid: mairor-disk-full
        title: 디스크 참
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: max by (server) (100 * (1 - node_filesystem_avail_bytes{job="integrations/unix", fstype=~"ext4|xfs"} / node_filesystem_size_bytes{job="integrations/unix", fstype=~"ext4|xfs"}))
          - *last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{evaluator: {type: gt, params: [85]}}]
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.server }} 서버 디스크가 85% 넘게 찼어요'
          description: 지금 {{ printf "%.0f" $values.B.Value }}%. docker image prune · 로그 · 작업 임시 파일을 확인하세요.

      - uid: mairor-metrics-missing
        title: 서버 지표 끊김
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # 지표가 오는 동안은 결과가 비어 NoData → 정상. 서버나 alloy 가 멈추면 그 서버 줄이 생긴다
              expr: absent_over_time(node_time_seconds{job="integrations/unix", server="app"}[5m]) or absent_over_time(node_time_seconds{job="integrations/unix", server="ai"}[5m])
          - *last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{evaluator: {type: gt, params: [0]}}]
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: {severity: critical}
        annotations:
          summary: '{{ $labels.server }} 서버 지표가 5분 동안 안 와요'
          description: 서버가 꺼졌거나 alloy 가 멈췄어요. EC2 상태와 docker compose ps(alloy)를 확인하세요.
