# Tempo 한 대 구성(파일 저장). 호출 흐름은 7일 보관한다
# 받은 span 으로 응답 시간 · 오류율 지표(span-metrics)와 서비스 연결도(service-graphs)를 만들어 prometheus 에 넣는다
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

metrics_generator:
  registry:
    external_labels:
      source: tempo
  # 기본 시간 구간은 16초까지라 몇 분 걸리는 가이드 작업의 p95 가 잡히지 않는다
  # 받는 쪽이 계측되지 않은 호출(BE → AI · 외부 API)은 server.address 로 연결도에 그린다
  processor:
    span_metrics:
      histogram_buckets: [0.01, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 20, 30, 60, 90, 120, 180, 300, 600]
    service_graphs:
      histogram_buckets: [0.01, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 20, 30, 60, 90, 120, 180, 300, 600]
      peer_attributes: [peer.service, db.name, db.system, server.address]
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    compaction:
      block_retention: 168h
    metrics_generator:
      processors: [span-metrics, service-graphs]

usage_report:
  reporting_enabled: false
