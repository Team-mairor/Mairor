# 콜백 입구(callback-gw): AI 서버가 BE 로 보내는 콜백 · 진행 알림만 받아 살아 있는 api 로 넘긴다(S15P31A306-355).
# AI 서버가 다른 EC2 에 있어 core 네트워크의 api:8080 에 바로 붙지 못하므로, BE 서버 호스트 8090 을 이 입구로 연다.
# 보안 그룹이 8090 을 AI 서버 보안 그룹에서만 받는다. 콜백은 인증 헤더가 없어 바깥(ALB · nginx)으로는 여전히 막는다.
# api 는 core 에서 api-a · api-b 두 컨테이너의 별칭이다. 슬롯을 바꾸는 동안 내려간 쪽은 Docker DNS 에서 빠지고,
# 연결이 실패하면 다른 쪽으로 다시 보낸다. 같은 jobId 콜백은 BE 가 한 번만 반영하므로 다시 보내도 안전하다.
server {
    listen 8090;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $api_upstream http://api:8080;

    location = /callback-gw-health {
        access_log off;
        return 200 "ok\n";
    }

    location /api/v1/internal/ai/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout non_idempotent;
        proxy_next_upstream_tries 2;
        client_max_body_size 20m;
    }

    location / {
        return 404;
    }
}
