# 로컬 개발용. 백엔드 bootRun 이 붙을 PostgreSQL 을 띄운다. 운영 compose 는 따로 만든다.
# 사용: cp .env.example .env → docker compose up -d postgres
# 테스트는 이 DB 를 쓰지 않는다(Testcontainers 가 따로 띄운다).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mairor}
      POSTGRES_USER: ${POSTGRES_USER:-mairor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?루트 .env 에 POSTGRES_PASSWORD 를 넣어 주세요}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
