# FE 정적 파일 규칙. 이미지 안에서 /etc/nginx/conf.d/default.conf 로 복사되어 nginx 기본 설정을 대신한다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # /api 프록시와 ALB 헬스체크는 BE가 관리한다 (frontend/nginx/api.conf)
    include /etc/nginx/snippets/api.conf;

    # 페이지: /preview 로 오면 preview.html, / 는 index.html. HTML은 매번 새 버전을 확인한다
    # $uri/ 대신 $uri/index.html: 폴더만 있는 주소(/my)가 301 → 403 대신 404가 된다
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # 파일 이름에 해시가 붙은 빌드 결과물: 1년 캐시
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # MediaPipe 실행 파일(wasm·js)과 모델: 1주 캐시
    location /mediapipe/ {
        add_header Cache-Control "public, max-age=604800";
    }
    location /models/ {
        add_header Cache-Control "public, max-age=604800";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
}
