# BE 관리. static.conf 의 server 블록 안에 include 된다.
# conf.d/ 에 두면 nginx가 최상위 설정으로 읽어 시작하지 못하므로 /etc/nginx/snippets/ 에 둔다.

# ALB 헬스체크: api 상태와 상관없이 nginx가 살아 있으면 200
location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# /api → Spring(api 컨테이너 8080). 경로는 그대로 넘긴다(context-path /api).
# api 주소를 요청 때 찾게 해서 api 컨테이너가 없어도 nginx는 뜬다. 이때 /api 는 502.
# 운영 compose 는 슬롯마다 네트워크를 나눠, 같은 슬롯의 api 만 이 이름(api)으로 찾힌다.
# 배포로 api 컨테이너가 바뀌면 주소도 바뀌므로 찾은 주소는 10초만 기억한다.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;
set $api_upstream http://api:8080;

# AI 서버 콜백(/api/v1/internal/ai/)은 바깥에서 막는다. AI 는 인증 헤더를 못 붙여 api 가 토큰 없이 받으므로,
# 내부망(core)에서 api:8080 으로 바로 오는 요청만 닿아야 한다(S15P31A306-311). 운영자 내부 API 는 토큰으로 열려 있다.
location /api/v1/internal/ai/ {
    return 404;
}

location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    client_max_body_size 6m;
}
