# AI 서버 검사: ai/README.md 에 적힌 린트·테스트 명령. 담당 AI.
ai:
  stage: check
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  rules:
    # master 머지 뒤에는 다시 돌리지 않는다. 같은 코드를 MR에서 이미 검사했다(fast-forward 머지 · 파이프라인 성공 필수)
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      when: never
    # 손으로 돌린 파이프라인(Run pipeline)에서는 바뀐 곳과 상관없이 돈다
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - ai/**/*
        - shared/**/*
        - .gitlab-ci.yml
        - ci/**/*
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
    UV_LINK_MODE: copy
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends libgl1 libglib2.0-0 libegl1 libgles2
    - cd ai
    - uv sync --locked
  script:
    - uv run ruff check .
    - uv run pytest
  cache:
    key:
      files:
        - ai/uv.lock
    paths:
      - .uv-cache/

# 화장품 수집 워커 이미지(ai/Dockerfile.collector, S15P31A306-513). master 머지 뒤 ai/ 가 바뀌면 빌드해 ECR mairor-collector 에 올린다.
# 태그는 커밋 해시 8자리와 latest. Fargate 작업 정의는 latest 를 써서 새로 뜨는 작업이 새 이미지를 받는다.
# 서버 배포(ci/deploy.yml)와 따로 돈다. 실패해도 배포를 막지 않고, ECR 저장소가 아직 없으면(인프라 S15P31A306-514 전) 건너뛴다.
build-collector:
  stage: build
  extends: .aws
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes:
        - ai/**/*
        - shared/**/*
        - ci/ai.yml
  allow_failure: true
  script:
    - |
      if ! aws ecr describe-repositories --repository-names mairor-collector > /dev/null 2>&1; then
        echo "ECR 저장소 mairor-collector 가 없어 건너뛴다(S15P31A306-514 에서 만든다)."
        exit 0
      fi
    - REG="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - aws ecr get-login-password | docker login --username AWS --password-stdin "$REG"
    - ref="$REG/mairor-collector:$CI_COMMIT_SHORT_SHA"
    - docker build -f ai/Dockerfile.collector -t "$ref" -t "$REG/mairor-collector:latest" .
    - docker push "$ref"
    - docker push "$REG/mairor-collector:latest"
    # 러너 디스크에 이미지가 쌓이지 않게 태그를 지운다. 빌드 캐시는 남아 다음 빌드가 빠르다
    - docker image rm "$ref" "$REG/mairor-collector:latest" > /dev/null
