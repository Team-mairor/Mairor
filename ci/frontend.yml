# 프론트 검사: frontend/README.md 에 적힌 검사 명령과 빌드. 담당 FE.
# 빌드 전 prebuild 가 shared/face-mesh 를 복사하고 MediaPipe 모델을 받으므로 shared/ 변경에도 돈다.
frontend:
  stage: check
  image: node:24
  rules:
    # master 머지 뒤에는 다시 돌리지 않는다. 같은 코드를 MR에서 이미 검사했다(fast-forward 머지 · 파이프라인 성공 필수)
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      when: never
    # 손으로 돌린 파이프라인(Run pipeline)에서는 바뀐 곳과 상관없이 돈다
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - frontend/**/*
        - shared/**/*
        - .gitlab-ci.yml
        - ci/**/*
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
    NEXT_TELEMETRY_DISABLED: "1"
    # 배포 이미지와 같은 값으로 빌드한다 (frontend/Dockerfile)
    DEV_TOOLS: "1"
  before_script:
    - cd frontend
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - npm run lint
    - npm run typecheck
    - npm run format:check
    - npm run test
    - npm run build
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/
