# MAIROR CI. 사용법과 규칙은 ci/README.md
# 파이프라인은 MR과 master에서만 돈다. 파트별 검사는 ci/<파트>.yml에 있고, 각 파트가 자기 파일을 고친다.
# master 머지 뒤에는 파트별 검사를 다시 돌리지 않는다. 같은 코드를 MR에서 이미 검사했기 때문이다
# (fast-forward 머지 · 파이프라인 성공 필수 · master 직접 push 불가). 대신 repo-guard 뒤 바로 이미지 빌드 · 운영 배포가 이어진다(ci/deploy.yml, BE 관리).
# 손으로 돌린 파이프라인(Run pipeline)에서는 검사가 전부 돈다.
# infra/ 가 바뀌면 인프라 서버 배포도 돈다(ci/infra.yml).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - check
  - build
  - deploy

default:
  tags: [mairor]
  interruptible: true

include:
  - local: ci/backend.yml
  - local: ci/frontend.yml
  - local: ci/ai.yml
  - local: ci/deploy.yml
  - local: ci/infra.yml

# 모든 파이프라인에서 돈다. 문서만 바뀐 MR에도 파이프라인이 생기게 하고,
# 커밋되면 안 되는 비밀 파일(.env, *.pem, *.key, *.keystore)이 있으면 실패한다. .env.example 은 허용.
repo-guard:
  stage: check
  image: alpine:3.22
  variables:
    GIT_DEPTH: "1"
  script:
    - |
      found=$(find . -path ./.git -prune -o -type f \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name '*.keystore' \) ! -name '.env.example' -print)
      if [ -n "$found" ]; then
        echo "커밋되면 안 되는 파일이 있습니다. 파일을 지우고 안의 키는 폐기·재발급하세요:"
        echo "$found"
        exit 1
      fi
      echo "비밀 파일 없음"
