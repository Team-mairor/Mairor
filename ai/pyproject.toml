[project]
name = "ai-server"
version = "0.1.0"
description = "메이크업 코칭 AI 서버 (영상 분석, 제품 피처 수집)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.156.4",
    "mediapipe>=1.1.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "streamlit>=1.66.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 확인 화면은 app 패키지를 찾으려고 import 전에 경로를 더한다
"tools/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
