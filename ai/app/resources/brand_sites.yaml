# 처음 넣을 사이트 목록(정책 문서 2-5 조사표). 표에 없는 브랜드도 공식 홈을 찾아 수집할 수 있다.
# platform: CAFE24 SHOPIFY WOOCOMMERCE MAKESHOP GODOMALL YOUNGCART SITECORE CUSTOM UNKNOWN
# technical: 구조를 확인했는가. OK PARTIAL(렌더링·간격 조절 필요) UNKNOWN NO(공식 홈 없음·봇 차단)
# policy: 수집해도 되는지 확인했는가. UNCONFIRMED(기본) TERMS_CHECKED PERMISSION(허락 기록 있음)
# enabled: 운영 수집에 쓰는가. policy 가 TERMS_CHECKED 또는 PERMISSION 이고 technical 이 OK 또는 PARTIAL 일 때만 true.
# robots_exempt: robots.txt 예외. policy 가 PERMISSION 일 때만 true.
# search_path: 사이트 검색 경로 템플릿({query}). 비우면 플랫폼 기본 경로를 쓰고, 기본이 없으면 검색을 건너뛴다.
# product_pattern: 상품 상세 주소의 경로 정규식(캡처 그룹 하나 = 상품 번호). 플랫폼 기본과 다른 사이트만 적는다.
# category_pattern: 카테고리 목록 주소의 경로 정규식. 플랫폼 기본과 다른 사이트만 적는다.
