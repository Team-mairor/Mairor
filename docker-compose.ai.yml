# AI 서버 운영 compose (AWS EC2 mairor-ai, /opt/mairor). BE 서버는 docker-compose.prod.yml.
# 직접 up 하지 않고 deploy/deploy-ai.sh 가 바꾼다. 절차는 deploy/README.md "AI 서버"(S15P31A306-355)
#
# ai 는 8000 을 이 서버의 모든 주소로 연다(Docker 기본 공개 주소는 127.0.0.1 이라 주소를 적는다).
# 바깥에서 닿지 않게 하는 것은 보안 그룹이다: 8000 은 BE 서버 보안 그룹에서만 받는다.
# BE 는 Parameter Store /mairor/prod/AI_BASE_URL(이 서버 사설 IP:8000)로 요청하고, AI 는 요청에 실린
# callbackUrl · progressUrl(BE 서버 사설 IP:8090 콜백 입구)로 결과를 보낸다.
#
# 값은 두 파일에서 온다. 둘 다 deploy-ai.sh 가 만들고 레포에는 없다.
#   .env     compose 가 읽는 이미지 주소·태그 (ECR_REGISTRY, IMAGE_TAG)
#   ai.env   컨테이너 환경변수. Parameter Store /mairor/ai/* 에서 만든다(권한 600). BE 비밀값은 받지 않는다
name: mairor-ai

x-logging: &logging
  driver: awslogs
  options:
    awslogs-region: ap-northeast-2
    awslogs-group: /mairor/prod
    tag: "{{.Name}}"
    mode: non-blocking
    max-buffer-size: 4m

services:
  ai:
    image: ${ECR_REGISTRY}/mairor-ai:${IMAGE_TAG}
    restart: unless-stopped
    logging: *logging
    env_file:
      - path: ai.env
        format: raw
    environment:
      LOG_FORMAT: json
      TRACING_ENDPOINT: http://alloy:4318/v1/traces
      OTEL_SERVICE_NAME: ai
    ports:
      - "0.0.0.0:8000:8000"
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    # m6i.2xlarge(8 vCPU · 32 GB, 시연 기간, S15P31A306-416). 가이드 영역 줄 수는 /mairor/ai/AREA_LINES(6).
    # alloy 몫과 OS 를 남긴다. 서버를 줄일 때는 이 값을 먼저 내린다(deploy/README.md "AI 서버 크기")
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 24G

  # 수집기. BE 서버와 같은 설정에 서버 이름만 다르다(Grafana 에서 server=ai 로 나뉜다)
  alloy:
    image: grafana/alloy:v1.21.3
    environment:
      INFRA_HOST: k15a306.p.ssafy.io
      SERVER_NAME: ai
    restart: unless-stopped
    logging: *logging
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    cgroup: host
    volumes:
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /run/udev/data:/run/udev/data:ro
      - /proc:/host/proc:ro
      - /sys:/sys:ro
      - /:/host/root:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  alloy-data:
